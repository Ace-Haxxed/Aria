name: Build Linux

# This repository holds the Linux build only. The workflow it replaced ran nine
# jobs covering every platform; after the split, eight of them had no source
# left to compile and failed on every push.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # libasound2-dev is cpal, libxdo-dev is enigo. Both are link-time only,
      # so clippy passes without them and `cargo test` is what fails.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libasound2-dev libxdo-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck the frontend
        run: npm run typecheck

      - name: Build the frontend
        run: npx vite build

      - name: Lint the Rust backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # `cargo fmt --check` is deliberately absent: the tree has never been
      # rustfmt-clean (115 hunks across 34 files), so enforcing it would fail
      # every run until someone accepts a repo-wide reformat.

      - name: Test the Rust backend
        working-directory: src-tauri
        run: cargo test --lib

  bundles:
    name: Linux (deb, rpm, AppImage)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libasound2-dev libxdo-dev patchelf rpm file

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the bundles
        run: npm run tauri -- build --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: aria-linux
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Publish the Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  arch:
    name: Arch Linux (pkg.tar.zst)
    needs: check
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git nodejs npm rust webkit2gtk-4.1 gtk3 \
            libayatana-appindicator librsvg openssl sudo \
            alsa-lib xdotool

      - uses: actions/checkout@v4

      - name: Create a build user
        # makepkg refuses to run as root, by design.
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build the application
        run: su builder -c 'npm ci && npm run tauri -- build --bundles deb'

      - name: Package for pacman
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/pkg && chown builder:builder /tmp/pkg

          # Repackage the built binary rather than compiling twice: makepkg's
          # build() would redo the whole Rust build for no benefit.
          cat > /tmp/pkg/PKGBUILD <<EOF
          pkgname=aria
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="AI assistant with full device control"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('custom')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator' 'alsa-lib' 'xdotool')
          optdepends=(
            'ydotool: mouse and keyboard control on Wayland'
            'wtype: text input on Wayland'
            'grim: screen capture on Wayland'
            'scrot: screen capture on X11'
            'wmctrl: window management on X11'
            'pamixer: volume control'
            'brightnessctl: screen brightness control'
            'ollama: local offline LLM backend'
          )
          options=('!strip')

          package() {
            install -Dm755 "\${GITHUB_WORKSPACE}/src-tauri/target/release/aria" \\
              "\${pkgdir}/usr/bin/aria"
            install -Dm644 "\${GITHUB_WORKSPACE}/src-tauri/icons/512x512.png" \\
              "\${pkgdir}/usr/share/icons/hicolor/512x512/apps/aria.png"

            install -Dm644 /dev/stdin "\${pkgdir}/usr/share/applications/aria.desktop" <<DESKTOP
          [Desktop Entry]
          Name=ARIA
          Comment=AI assistant with full device control
          Exec=aria
          Icon=aria
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP
          }
          EOF

          chown builder:builder /tmp/pkg/PKGBUILD
          su builder -c "cd /tmp/pkg && GITHUB_WORKSPACE='$GITHUB_WORKSPACE' makepkg -f --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: aria-arch
          retention-days: 14
          if-no-files-found: error
          path: /tmp/pkg/*.pkg.tar.zst
