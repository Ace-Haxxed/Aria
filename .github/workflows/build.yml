name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release from this run'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep debug info out of CI builds; it triples link time for no benefit here.
  CARGO_PROFILE_RELEASE_DEBUG: '0'

jobs:
  # ── Gate everything on the code actually being valid ──────────────
  check:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck the frontend
        run: npm run typecheck

      - name: Build the frontend
        run: npx vite build

      - name: Check the Rust backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

  # ── Linux: .deb, .rpm, .AppImage ─────────────────────────────────
  build-linux:
    name: Linux (deb, rpm, AppImage)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            patchelf rpm file

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build bundles
        run: npm run tauri -- build --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Arch Linux: .pkg.tar.zst ─────────────────────────────────────
  build-arch:
    name: Arch Linux (pkg.tar.zst)
    needs: check
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git nodejs npm rust webkit2gtk-4.1 gtk3 \
            libayatana-appindicator librsvg openssl sudo

      - uses: actions/checkout@v4

      - name: Create a build user
        # makepkg refuses to run as root, by design.
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build the application
        run: su builder -c 'npm ci && npm run tauri -- build --bundles deb'

      - name: Package for pacman
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/pkg && chown builder:builder /tmp/pkg

          # Repackage the built binary rather than compiling twice: makepkg's
          # build() would redo the whole Rust build for no benefit.
          cat > /tmp/pkg/PKGBUILD <<EOF
          pkgname=jarvis
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Cross-platform AI assistant with full device control"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'libayatana-appindicator')
          optdepends=(
            'xdotool: mouse and keyboard control on X11'
            'ydotool: mouse and keyboard control on Wayland'
            'wtype: text input on Wayland'
            'grim: screen capture on Wayland'
            'scrot: screen capture on X11'
            'wmctrl: window management on X11'
            'pamixer: volume control'
            'brightnessctl: screen brightness control'
            'ollama: local offline LLM backend'
          )
          options=('!strip')

          package() {
            install -Dm755 "\${GITHUB_WORKSPACE}/src-tauri/target/release/jarvis" \\
              "\${pkgdir}/usr/bin/jarvis"
            install -Dm644 "\${GITHUB_WORKSPACE}/src-tauri/icons/512x512.png" \\
              "\${pkgdir}/usr/share/icons/hicolor/512x512/apps/jarvis.png"
            install -Dm644 "\${GITHUB_WORKSPACE}/LICENSE" \\
              "\${pkgdir}/usr/share/licenses/jarvis/LICENSE"

            install -Dm644 /dev/stdin "\${pkgdir}/usr/share/applications/jarvis.desktop" <<DESKTOP
          [Desktop Entry]
          Name=Jarvis
          Comment=AI assistant with full device control
          Exec=jarvis
          Icon=jarvis
          Terminal=false
          Type=Application
          Categories=Utility;
          DESKTOP
          }
          EOF

          chown builder:builder /tmp/pkg/PKGBUILD
          su builder -c "cd /tmp/pkg && GITHUB_WORKSPACE='$GITHUB_WORKSPACE' makepkg -f --noconfirm"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          retention-days: 14
          if-no-files-found: error
          path: /tmp/pkg/*.pkg.tar.zst

  # ── Windows: .msi, NSIS setup, portable .exe ─────────────────────
  build-windows:
    name: Windows (msi, exe)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installers
        run: npm run tauri -- build --bundles msi,nsis

      - name: Stage the portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          # The raw binary needs no installer — WebView2 is present on Win11 and
          # on any Win10 with Edge, so this runs standalone.
          Copy-Item src-tauri/target/release/jarvis.exe portable/jarvis-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            portable/jarvis-portable.exe

  # ── macOS: universal .dmg ────────────────────────────────────────
  build-macos:
    name: macOS (universal dmg)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build a universal bundle
        # Unsigned unless the secrets are present; an unsigned .dmg still
        # installs, it just needs a right-click → Open on first launch.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg,app

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          retention-days: 14
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ── Android: debug .apk + release .aab ───────────────────────────
  build-android:
    name: Android (apk, aab)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Sync the web build into the Android project
        run: npm run cap:sync

      - name: Decode the signing keystore
        id: keystore
        # Unsigned builds are still useful for sideloading, so a missing
        # keystore downgrades rather than fails.
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/jarvis.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret set — producing an unsigned release bundle."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build the release bundle
        working-directory: android
        env:
          JARVIS_KEYSTORE_PATH: jarvis.keystore
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: android-bundles
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

  # ── iOS: .ipa, uploaded to TestFlight when signing is configured ──
  build-ios:
    name: iOS (ipa)
    needs: check
    runs-on: macos-latest
    # Signing needs an Apple developer account, so this only runs when the
    # secrets exist. Without it the job would fail on every fork.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync the web build into the iOS project
        run: npm run cap:sync

      - name: Check for signing credentials
        id: signing
        run: |
          if [ -n "${{ secrets.APPSTORE_KEY_ID }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No App Store Connect credentials — building unsigned to verify it compiles."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned (verification only)
        if: steps.signing.outputs.available == 'false'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build and upload to TestFlight
        if: steps.signing.outputs.available == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          gem install fastlane --no-document
          fastlane ios beta

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: ios-bundle
          retention-days: 14
          if-no-files-found: warn
          path: '**/*.ipa'

  # ── Publish ──────────────────────────────────────────────────────
  release:
    name: Publish release
    needs: [build-linux, build-arch, build-windows, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten the artifact tree
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.pkg.tar.zst' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.dmg' -o -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} release/ \;
          ls -lh release/

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Install

            | Platform | Download |
            |---|---|
            | Arch Linux | `.pkg.tar.zst` |
            | Fedora / RHEL | `.rpm` |
            | Ubuntu / Debian | `.deb` |
            | Any Linux | `.AppImage` |
            | Windows | `.msi` (installer) or `jarvis-portable.exe` |
            | macOS 12+ | `.dmg` (universal) |
            | Android 8+ | `.apk` (sideload) |

            Verify a download against `SHA256SUMS.txt` before installing.

            After installing, run `bash scripts/download-models.sh` if you want
            fully offline voice.
